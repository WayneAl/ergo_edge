[project]
name = "linesafe"
version = "0.1.0"
description = "Continuous REBA/RULA ergonomic risk scoring from pose estimation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2",
    "opencv-python>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
pose = ["ultralytics>=8.3"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
linesafe = "linesafe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linesafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
