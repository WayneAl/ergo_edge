# LineSafe Stage I demo video. Edit narration here; `make video` rebuilds.
# Every number spoken must be a row in deck/claims.md. Footage lives in video/footage/ (gitignored).
voice = "en-US-AndrewNeural"
max_total_s = 180

[[shot]]
id = "problem"
slide = 2
narration = """
In most plants, ergonomic risk is still assessed with a clipboard. A safety manager watches one station, scores each
posture by eye on a paper REBA or RULA sheet, and types it into a monthly report. Two assessors give two scores, the
risky posture happens when nobody is watching, and nothing is left to show what changed.
"""

[[shot]]
id = "approach"
slide = 5
narration = """
LineSafe turns the station PC into a continuous assessor. A camera feeds a pose model that finds 17 body keypoints.
Plain geometry turns them into joint angles, and the published REBA and RULA tables turn the angles into a score. The
same posture always gives the same score, and every score names the angle behind it.
"""

# Public footage (YouTube 27N3I5kvbjk), composited by video/site_replay.sh (source 0:20–1:20, fade at 0:49).
# Publish this video only after the uploader has given written permission.
[[shot]]
id = "site_intro"
clip = "video/footage/site_replay.mp4"
in_s = 0.0
out_s = 8.0
narration = """
Public footage from a construction site, replayed offline through the prototype on a laptop.
"""

[[shot]]
id = "site_climb"
clip = "video/footage/site_replay.mp4"
in_s = 8.0
out_s = 27.0
narration = """
Upright, the score is Low. As the worker bends to lift the tiles, it climbs through Medium to High, and holding the
bend raises an alert. The pose model runs at about 48 frames per second on the laptop.
"""

[[shot]]
id = "site_fade"
clip = "video/footage/site_replay.mp4"
in_s = 27.0
out_s = 42.0
lead_s = 1.5
narration = """
Once the skeleton is extracted, the image is thrown away. The next lift is scored from the skeleton alone.
"""

[[shot]]
id = "site_event"
clip = "video/footage/site_replay.mp4"
in_s = 42.0
out_s = 60.0
lead_s = 1.0
narration = """
Every posture held in High becomes an event, stored with the angles that drove it, here trunk flexion and a raised arm.
"""

# The real dashboard over the replay's events, phone layout, by video/dashboard_view.sh.
[[shot]]
id = "dashboard"
clip = "video/footage/dashboard_phone.mp4"
in_s = 0.0
out_s = 22.0
narration = """
The safety manager's dashboard, shown in its phone layout, lists each event with the station, the time, the peak
score and the angles behind it. No video is stored, no one is identified, and nothing leaves the plant network.
"""

[[shot]]
id = "stage_two"
slide = 16
narration = """
As a finalist, we bring the pipeline up on the UGen300, measure throughput per stream, and check the scores against
certified human assessors.
"""

[[shot]]
id = "close"
slide = 1
hold_s = 2.0
narration = """
LineSafe. Continuous ergonomic risk scoring at the workstation, offline, on an ASUS UGen300.
"""
